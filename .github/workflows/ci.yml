name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run validation and tests
        run: make test

      - name: Build application bundle
        run: make app

      - name: Verify application signature
        run: codesign --verify --deep --strict --verbose=2 "dist/Bird HiDPI.app"
