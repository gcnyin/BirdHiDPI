name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build GitHub release
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag version
        shell: bash
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match app version '$version'" >&2
            exit 1
          fi

      - name: Run validation and tests
        run: make test

      - name: Build release archive
        run: make release

      - name: Verify release checksum
        shell: bash
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          cd dist
          shasum -a 256 -c "Bird-HiDPI-$version-macos.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Bird-HiDPI-$version-macos.zip" \
            "dist/Bird-HiDPI-$version-macos.zip.sha256" \
            --title "Bird HiDPI $version" \
            --generate-notes
