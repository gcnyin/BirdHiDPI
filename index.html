<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bird HiDPI — macOS menu bar HiDPI utility</title>
<meta name="description" content="Bird HiDPI is a lightweight native macOS menu bar utility for selecting HiDPI modes that WindowServer already provides for a real external display.">
<style>
  :root{
    --bg:#0b0d10; --panel:#13161b; --panel-2:#1a1e25; --fg:#e6e8eb; --muted:#9aa3ad;
    --accent:#4ea1ff; --accent-2:#7bd88f; --border:#262b33;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans",sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px; margin:0 auto; padding:0 20px}
  header{
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#11141a, #0b0d10);
    padding:48px 0 36px;
  }
  .hero{display:flex; align-items:center; gap:20px; flex-wrap:wrap}
  .logo{
    width:88px;height:88px;border-radius:20px;
    background:conic-gradient(from 210deg,#4ea1ff,#7bd88f,#f4c95d,#4ea1ff);
    display:grid;place-items:center; box-shadow:0 12px 36px rgba(78,161,255,.25);
  }
  .logo span{font-size:40px; line-height:1}
  h1{font-size:30px; margin:0; letter-spacing:-.01em}
  .tag{color:var(--muted); font-size:15px; margin-top:6px}
  .langbar{margin-top:22px; display:flex; gap:8px; flex-wrap:wrap}
  .langbar button{
    background:var(--panel-2); color:var(--muted); border:1px solid var(--border);
    border-radius:999px; padding:5px 13px; font-size:13px; cursor:pointer; transition:.15s;
  }
  .langbar button:hover{color:var(--fg); border-color:var(--accent)}
  .langbar button.active{background:var(--accent); color:#061018; border-color:var(--accent); font-weight:600}
  section{padding:48px 0}
  h2{font-size:21px; margin:0 0 16px; letter-spacing:-.01em}
  .lead{font-size:17px; color:var(--fg)}
  .features{list-style:none; margin:0; padding:0; display:grid; gap:10px}
  .features li{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:13px 16px; position:relative; padding-left:40px;
    color:var(--fg);
  }
  .features li::before{
    content:""; position:absolute; left:16px; top:18px; width:8px;height:8px;
    border-radius:50%; background:var(--accent-2);
  }
  .shot{
    margin-top:8px; border:1px solid var(--border); border-radius:14px;
    overflow:hidden; background:var(--panel);
    box-shadow:0 18px 60px rgba(0,0,0,.4);
  }
  .shot img{width:100%; display:block}
  .warn{
    border-left:3px solid #f4c95d; background:rgba(244,201,93,.08);
    padding:14px 16px; border-radius:8px; color:var(--fg); margin:6px 0 0;
  }
  .warn b{color:#f4c95d}
  pre{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; overflow-x:auto; font-size:13.5px; color:#cfd6de;
  }
  code{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  code.inline{background:var(--panel-2); padding:2px 6px; border-radius:5px; font-size:.92em}
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px}
  .card h3{margin:0 0 8px; font-size:15px; color:var(--accent)}
  .card p{margin:0; font-size:14px; color:var(--muted)}
  footer{border-top:1px solid var(--border); padding:30px 0; color:var(--muted); font-size:13px}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
  @media(max-width:640px){ .cards,.grid3{grid-template-columns:1fr} }
  .pill{display:inline-block; background:var(--panel-2); border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:4px 10px; font-size:12px; margin:2px 4px 2px 0}
  .hidden{display:none !important}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hero">
      <div class="logo"><span>🐦</span></div>
      <div>
        <h1>Bird HiDPI</h1>
        <div class="tag" data-i18n="tag"></div>
      </div>
    </div>
    <nav class="langbar" id="langbar">

      <button data-lang="zh-TW">繁體中文</button>

      <button data-lang="it">Italiano</button>
      <button data-lang="es">Español</button>
      <button data-lang="pt">Português</button>
      <button data-lang="sv">Svenska</button>
      <button data-lang="nb">Norsk bokmål</button>
      <button data-lang="ga">Gaeilge</button>
    </nav>
  </div>
</header>

<div class="wrap">

  <section>
    <p class="lead" data-i18n="intro"></p>
    <div class="warn"><b data-i18n="warnTitle"></b> <span data-i18n="warn"></span></div>
  </section>

  <section>
    <h2 data-i18n="featuresTitle"></h2>
    <ul class="features">
      <li data-i18n="f1"></li>
      <li data-i18n="f2"></li>
      <li data-i18n="f3"></li>
      <li data-i18n="f4"></li>
      <li data-i18n="f5"></li>
      <li data-i18n="f6"></li>
      <li data-i18n="f7"></li>
      <li data-i18n="f8"></li>
    </ul>
  </section>

  <section>
    <h2 data-i18n="shotTitle"></h2>
    <p data-i18n="shotDesc" style="color:var(--muted); margin-top:0"></p>
    <div class="shot"><img src="assets/screenshot.png" alt="Bird HiDPI screenshot"></div>
  </section>

  <section>
    <h2 data-i18n="howTitle"></h2>
    <p data-i18n="howP1"></p>
    <p data-i18n="howP2"></p>
  </section>

  <section>
    <h2 data-i18n="reqTitle"></h2>
    <div class="cards">
      <div class="card"><h3 data-i18n="r1t"></h3><p data-i18n="r1d"></p></div>
      <div class="card"><h3 data-i18n="r2t"></h3><p data-i18n="r2d"></p></div>
    </div>
    <p style="margin-top:14px; color:var(--muted)">
      <span data-i18n="langLabel"></span>
      <span class="pill">English</span><span class="pill">简体中文</span><span class="pill">繁體中文</span>
      <span class="pill">Français</span><span class="pill">Deutsch</span><span class="pill">Italiano</span>
      <span class="pill">Español</span><span class="pill">Português</span><span class="pill">Svenska</span>
      <span class="pill">Norsk bokmål</span><span class="pill">Gaeilge</span>
    </p>
  </section>

  <section>
    <h2 data-i18n="installTitle"></h2>
    <p data-i18n="installRel"></p>
    <p style="margin:18px 0 6px; color:var(--muted)" data-i18n="buildTitle"></p>
    <pre><code>git clone https://github.com/gcnyin/BirdHiDPI.git
cd BirdHiDPI
make test
make app
open "dist/Bird HiDPI.app"</code></pre>
  </section>

  <section>
    <h2 data-i18n="usageTitle"></h2>
    <ol style="padding-left:22px; color:var(--fg)">
      <li data-i18n="u1"></li>
      <li data-i18n="u2"></li>
      <li data-i18n="u3"></li>
      <li data-i18n="u4"></li>
      <li data-i18n="u5"></li>
    </ol>
  </section>

  <section>
    <h2 data-i18n="privacyTitle"></h2>
    <p data-i18n="privacy"></p>
  </section>

</div>

<footer>
  <div class="wrap">
    <span data-i18n="footer"></span>
    <a href="https://github.com/gcnyin/BirdHiDPI">GitHub</a> ·
    <a href="https://github.com/gcnyin/BirdHiDPI/releases" data-i18n="releases"></a> ·
    <a href="https://github.com/gcnyin/BirdHiDPI/blob/main/LICENSE">MIT License</a>
  </div>
</footer>

  }
};

function applyLang(lang){
  const dict = I18N[lang] || I18N.en;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(dict[k]!==undefined) el.textContent = dict[k];
  });
  document.documentElement.lang = lang;
  document.querySelectorAll("#langbar button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang===lang);
  });
  try{ localStorage.setItem("birdhidpi-lang", lang); }catch(e){}
}

const nav = navigator.language || "en";
let initLang = "en";
const match = Object.keys(I18N).find(l=> nav.toLowerCase().startsWith(l.toLowerCase()));
if(match) initLang = match;
try{ const saved = localStorage.getItem("birdhidpi-lang"); if(saved && I18N[saved]) initLang = saved; }catch(e){}
applyLang(initLang);

document.getElementById("langbar").addEventListener("click", e=>{
  if(e.target.matches("button[data-lang]")) applyLang(e.target.dataset.lang);
});
</script>
